name: Pre-Market Momentum Scanner & Tracker

on:
  schedule:
    # 08:30 AM EDT / EST (Monday - Friday)
    - cron: '30 12 * * 1-5'
    # 04:10 PM EDT / EST (Monday - Friday)
    - cron: '10 20 * * 1-5'
  workflow_dispatch:
    inputs:
      job_type:
        description: 'Choose workflow job to run'
        required: true
        default: 'morning_scan'
        type: choice
        options:
          - 'morning_scan'
          - 'follow_through'

permissions:
  contents: write
  pages: write

jobs:
  run-momentum:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install tradingview-screener yfinance pandas plotly mplfinance matplotlib pillow requests

      - name: Run Morning Pre-Market Scanner
        if: github.event.schedule == '30 12 * * 1-5' || github.event.inputs.job_type == 'morning_scan' || github.event_name == 'workflow_dispatch' && github.event.inputs.job_type != 'follow_through'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/small_cap_gappers.py

      - name: Run Market-Close Follow-Through Tracker
        if: github.event.schedule == '10 20 * * 1-5' || github.event.inputs.job_type == 'follow_through'
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python scripts/track_follow_through.py

      - name: Commit and Push Updated Results
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Actions Automation"
          git add index.html data/gappers_history.csv reports/catalysts.json || true
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Automated update: Ingest momentum scan & follow-through analytics [skip ci]"
            git push origin main
          fi
